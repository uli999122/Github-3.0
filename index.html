<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05050a">
<title>Pivot Agent · Chat</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root {
    --bg: #05050a;
    --surface: #0d0d16;
    --surface2: #151525;
    --text: #f0f0f5;
    --text2: #8888aa;
    --accent: #7c3aed;
    --accent2: #a78bfa;
    --accent3: #c084fc;
    --gradient: linear-gradient(135deg, #7c3aed 0%, #a78bfa 50%, #c084fc 100%);
    --gradient-subtle: linear-gradient(135deg, rgba(124,58,237,0.08), rgba(168,139,250,0.04));
    --danger: #ef4444;
    --success: #34d399;
    --font: 'Inter', -apple-system, sans-serif;
    --font-display: 'Space Grotesk', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; background: var(--bg); font-family: var(--font); color: var(--text); overflow: hidden; font-size: 14px; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.85; transform: scale(1.02); } }
@keyframes float3D { 0%, 100% { transform: translateY(0) rotateX(0) rotateY(0); } 33% { transform: translateY(-10px) rotateX(6deg) rotateY(4deg); } 66% { transform: translateY(6px) rotateX(-4deg) rotateY(-6deg); } }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes bubbleIn { 0% { opacity: 0; transform: translateY(20px) scale(0.9); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes gradientMove { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
@keyframes typingBounce { 0%, 100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-6px); opacity: 1; } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 20px rgba(124,58,237,0.4), 0 0 40px rgba(124,58,237,0.2); } 50% { box-shadow: 0 0 40px rgba(124,58,237,0.8), 0 0 80px rgba(124,58,237,0.4); } }

.app-container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
}

.app-container::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 20% 10%, rgba(124,58,237,0.18) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 90%, rgba(34,211,238,0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(236,72,153,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
}

.header {
    padding: 16px 20px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    background: rgba(5,5,10,0.85);
    backdrop-filter: blur(40px) saturate(200%);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 10;
    position: relative;
    animation: slideUp 0.5s ease;
}

.agent-avatar {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(124,58,237,0.35), rgba(168,139,250,0.15));
    border: 1.5px solid rgba(124,58,237,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
    animation: glow 3s ease-in-out infinite;
    position: relative;
}

.agent-avatar svg {
    width: 28px;
    height: 28px;
    stroke: #fff;
    stroke-width: 2;
    fill: none;
    filter: drop-shadow(0 0 8px rgba(168,139,250,0.8));
}

.agent-info { flex: 1; min-width: 0; }
.agent-name {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.agent-status {
    font-size: 11px;
    color: var(--success);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 5px;
}
.agent-status::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--success);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--success);
    animation: pulse 2s infinite;
}

.badge {
    padding: 6px 12px;
    background: var(--gradient);
    background-size: 200% 200%;
    border-radius: 20px;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #fff;
    text-transform: uppercase;
    animation: gradientMove 3s ease infinite;
    flex-shrink: 0;
}

.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
    position: relative;
    z-index: 1;
}

.chat-messages::-webkit-scrollbar { width: 4px; }
.chat-messages::-webkit-scrollbar-thumb { background: rgba(124,58,237,0.3); border-radius: 4px; }

.message {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.6;
    word-wrap: break-word;
    animation: bubbleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    position: relative;
}

.message.user {
    background: var(--gradient);
    background-size: 200% 200%;
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    animation: bubbleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1), gradientMove 4s ease infinite;
    font-weight: 500;
}

.message.agent {
    background: var(--surface2);
    border: 1px solid rgba(255,255,255,0.06);
    color: var(--text);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
}

.message.system {
    background: rgba(255,255,255,0.05);
    color: var(--text2);
    align-self: center;
    font-size: 11px;
    text-align: center;
    max-width: 90%;
    border-radius: 12px;
    padding: 8px 14px;
    border: 1px solid rgba(255,255,255,0.05);
}

.message.error {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    color: #f87171;
    align-self: center;
    font-size: 11px;
    text-align: center;
    max-width: 90%;
    border-radius: 12px;
    padding: 8px 14px;
}

.message.agent p { margin-bottom: 8px; }
.message.agent p:last-child { margin-bottom: 0; }
.message.agent code {
    background: rgba(0,0,0,0.4);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent2);
}
.message.agent pre {
    background: rgba(0,0,0,0.5);
    padding: 12px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 8px 0;
    font-family: var(--font-mono);
    font-size: 12px;
}
.message.agent pre code { background: none; padding: 0; }
.message.agent ul, .message.agent ol { margin: 8px 0 8px 20px; }
.message.agent a { color: var(--accent2); text-decoration: underline; }
.message.agent strong { color: var(--accent2); font-weight: 700; }
.message.agent table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 12px;
    border-radius: 8px;
    overflow: hidden;
}
.message.agent th {
    background: rgba(124,58,237,0.3);
    padding: 8px 10px;
    text-align: left;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #e9d5ff;
    font-weight: 700;
}
.message.agent td {
    padding: 8px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}

.typing-indicator {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--surface2);
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    align-self: flex-start;
    border: 1px solid rgba(255,255,255,0.06);
    max-width: 200px;
    animation: bubbleIn 0.3s ease;
}

.typing-avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    animation: pulse 2s infinite;
}

.typing-avatar svg { width: 12px; height: 12px; stroke: #fff; fill: none; stroke-width: 2.5; }

.typing-dots { display: flex; gap: 4px; align-items: center; }
.typing-dot {
    width: 7px;
    height: 7px;
    background: var(--accent2);
    border-radius: 50%;
    animation: typingBounce 1.4s infinite ease-in-out both;
}
.typing-dot:nth-child(1) { animation-delay: -0.32s; }
.typing-dot:nth-child(2) { animation-delay: -0.16s; }

.input-area {
    padding: 16px 20px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: rgba(5,5,10,0.95);
    backdrop-filter: blur(30px);
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex;
    gap: 10px;
    align-items: center;
    z-index: 10;
    position: relative;
}

.input-wrapper {
    flex: 1;
    display: flex;
    gap: 10px;
    background: var(--surface2);
    padding: 6px;
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.3s;
    align-items: center;
}

.input-wrapper:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(124,58,237,0.15), 0 8px 30px rgba(124,58,237,0.2);
}

.chat-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    padding: 10px 16px;
    min-width: 0;
}

.chat-input::placeholder { color: var(--text2); opacity: 0.7; }

.send-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--gradient);
    background-size: 200% 200%;
    border: none;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s;
    flex-shrink: 0;
    box-shadow: 0 4px 20px rgba(124,58,237,0.4);
    animation: gradientMove 3s ease infinite;
}

.send-btn:hover:not(:disabled) { transform: scale(1.08) rotate(-5deg); box-shadow: 0 8px 30px rgba(124,58,237,0.7); }
.send-btn:active:not(:disabled) { transform: scale(0.95); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; animation: none; }
.send-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.5; }

.spinner {
    width: 18px;
    height: 18px;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@media (max-width: 600px) {
    .agent-name { font-size: 15px; }
    .agent-avatar { width: 44px; height: 44px; }
    .agent-avatar svg { width: 24px; height: 24px; }
    .badge { display: none; }
    .message { font-size: 13px; padding: 10px 14px; }
    .chat-messages { padding: 18px 14px; gap: 12px; }
    .input-area { padding: 12px 14px; }
}
</style>
</head>
<body>

<div class="app-container">
    
    <header class="header">
        <div class="agent-avatar">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="10" rx="2"/>
                <circle cx="12" cy="5" r="2"/>
                <path d="M12 7v4"/>
                <line x1="8" y1="16" x2="8" y2="16"/>
                <line x1="16" y1="16" x2="16" y2="16"/>
            </svg>
        </div>
        <div class="agent-info">
            <div class="agent-name" id="agentName">Conectando...</div>
            <div class="agent-status" id="agentStatus">En línea</div>
        </div>
        <div class="badge">Pivot AI</div>
    </header>

    <div class="chat-messages" id="chatMessages">
        <div class="message system">Conectado con Pivot Agent. Escribí tu mensaje para comenzar.</div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" class="chat-input" id="chatInput" placeholder="Escribí tu mensaje..." autocomplete="off" onkeypress="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
            </button>
        </div>
    </div>

</div>

<script>
const API_KEY = 'pk_0a1c3766129d632d3235186ef60cc3b681be9e6c0fab8a237fa1cb2792a99eb5';
const AGENT_ID = 'pivot_919c7eacab848e10f18b7d3e';
const API_URL = 'https://pivot-agent-psi.vercel.app/v1/chat/completions';

let conversationHistory = [];
let isSending = false;

marked.setOptions({ breaks: true, gfm: true, tables: true, sanitize: false, smartLists: true });

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderMarkdown(text) {
    if (!text) return '';
    let html = DOMPurify.sanitize(marked.parse(text), { ADD_ATTR: ['target', 'rel'] });
    return html;
}

function addMessage(role, content) {
    const container = document.getElementById('chatMessages');
    const msg = document.createElement('div');
    msg.className = 'message ' + role;
    
    if (role === 'agent') {
        msg.innerHTML = renderMarkdown(content);
    } else {
        msg.textContent = content;
    }
    
    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;
}

function addError(message) {
    const container = document.getElementById('chatMessages');
    const msg = document.createElement('div');
    msg.className = 'message error';
    msg.textContent = '❌ ' + message;
    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;
}

function showTyping() {
    const container = document.getElementById('chatMessages');
    const typing = document.createElement('div');
    typing.className = 'typing-indicator';
    typing.id = 'typingIndicator';
    typing.innerHTML = `
        <div class="typing-avatar">
            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/></svg>
        </div>
        <div class="typing-dots">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>
    `;
    container.appendChild(typing);
    container.scrollTop = container.scrollHeight;
}

function hideTyping() {
    const typing = document.getElementById('typingIndicator');
    if (typing) typing.remove();
}

function setLoading(loading) {
    const btn = document.getElementById('sendBtn');
    const input = document.getElementById('chatInput');
    if (loading) {
        btn.disabled = true;
        input.disabled = true;
        btn.innerHTML = '<div class="spinner"></div>';
    } else {
        btn.disabled = false;
        input.disabled = false;
        btn.innerHTML = '<svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
        input.focus();
    }
}

async function sendMessage() {
    if (isSending) return;
    
    const input = document.getElementById('chatInput');
    const message = input.value.trim();
    
    if (!message) return;
    
    isSending = true;
    addMessage('user', message);
    input.value = '';
    setLoading(true);
    showTyping();
    
    conversationHistory.push({ role: 'user', content: message });
    
    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + API_KEY
            },
            body: JSON.stringify({
                agentId: AGENT_ID,
                model: 'pivot-agent',
                messages: conversationHistory.slice(-20)
            })
        });
        
        hideTyping();
        
        const data = await response.json();
        
        if (response.ok && data.choices && data.choices[0]) {
            const reply = data.choices[0].message.content;
            addMessage('agent', reply);
            conversationHistory.push({ role: 'assistant', content: reply });
            
            if (conversationHistory.length > 40) {
                conversationHistory = conversationHistory.slice(-20);
            }
        } else {
            addError(data.error || 'Error al procesar la respuesta');
        }
    } catch (e) {
        hideTyping();
        addError('Error de conexión: ' + e.message);
    }
    
    setLoading(false);
    isSending = false;
}

window.addEventListener('load', () => {
    const agentNameEl = document.getElementById('agentName');
    agentNameEl.textContent = 'Pivot Agent';
    
    setTimeout(() => {
        document.getElementById('chatInput').focus();
    }, 500);
});
</script>
</body>
</html>
