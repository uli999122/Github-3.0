<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZERO-DAY // Core Access</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg-main: #030503; --bg-card: #080c08; --bg-input: #0a120a;
    --primary: #00ff41; --primary-glow: rgba(0, 255, 65, 0.3);
    --accent: #008f11; --text-main: #d1ffd1; --text-muted: #4a7a4a; --danger: #ff003c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-main);
    background-image: linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
    background-size: 20px 20px; font-family: 'Courier New', Courier, monospace;
    display: flex; justify-content: center; align-items: center; height: 100vh; color: var(--text-main);
  }
  .hx-shell {
    width: 440px; height: 680px; background: var(--bg-card); border-radius: 12px;
    border: 1px solid var(--accent); box-shadow: 0 0 30px rgba(0, 255, 65, 0.1), inset 0 0 20px rgba(0, 255, 65, 0.05);
    display: flex; flex-direction: column; overflow: hidden; position: relative;
  }
  .hx-shell::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--primary); box-shadow: 0 0 10px var(--primary); opacity: 0.8; }
  
  /* PANTALLA DE VERIFICACIÓN */
  #authScreen {
    position: absolute; inset: 0; background: rgba(8, 12, 8, 0.95); z-index: 10;
    display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center;
  }
  #authScreen h2 { color: var(--primary); margin-bottom: 10px; font-size: 1.2rem; }
  #authScreen p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }
  #mathQuestion { font-size: 1.5rem; font-weight: bold; margin: 15px 0; color: var(--text-main); letter-spacing: 2px; }
  #mathAnswer {
    background: #000; border: 1px solid var(--primary); color: var(--primary); padding: 10px;
    font-size: 1.2rem; text-align: center; width: 100px; outline: none; font-family: inherit;
  }
  #verifyBtn {
    margin-top: 20px; background: var(--primary); color: #000; border: none; padding: 12px 24px;
    font-weight: bold; font-family: inherit; cursor: pointer; border-radius: 4px; transition: all 0.2s;
  }
  #verifyBtn:hover { background: #fff; box-shadow: 0 0 15px var(--primary); }
  #authError { color: var(--danger); font-size: 0.8rem; margin-top: 15px; display: none; }

  .hx-head { padding: 16px 20px; background: #050805; border-bottom: 1px solid var(--accent); display: flex; align-items: center; justify-content: space-between; }
  .hx-brand { display: flex; align-items: center; gap: 12px; }
  .hx-avatar { position: relative; width: 40px; height: 40px; background: #000; border: 1px solid var(--primary); border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 18px; color: var(--primary); box-shadow: 0 0 10px rgba(0,255,65,0.2); }
  .hx-status { width: 8px; height: 8px; background-color: var(--primary); border-radius: 50%; position: absolute; bottom: 2px; right: 2px; box-shadow: 0 0 8px var(--primary); animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .hx-title h3 { font-size: 1.1rem; font-weight: bold; letter-spacing: 2px; color: var(--primary); text-transform: uppercase; }
  .hx-title p { font-size: 0.7rem; color: var(--text-muted); }
  .hx-clear { background: transparent; border: 1px solid var(--accent); color: var(--primary); border-radius: 4px; width: 34px; height: 34px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s; }
  .hx-clear:hover { background: rgba(0, 255, 65, 0.1); box-shadow: 0 0 10px var(--primary-glow); }
  .hx-clear svg { fill: currentColor; width: 16px; height: 16px; }
  .hx-stream { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
  .hx-msg { max-width: 85%; padding: 12px 16px; border-radius: 6px; font-size: 0.9rem; line-height: 1.5; animation: hxIn 0.2s ease-out forwards; opacity: 0; transform: translateX(-10px); word-wrap: break-word; }
  @keyframes hxIn { to { opacity: 1; transform: translateX(0); } }
  .hx-msg.usr { background: #0a120a; color: var(--primary); align-self: flex-end; border: 1px solid var(--accent); border-right: 3px solid var(--primary); }
  .hx-msg.bot { background: #000; color: #a3ffa3; align-self: flex-start; border: 1px solid #1a331a; border-left: 3px solid var(--primary); }
  .hx-msg.bot p { margin-bottom: 8px; } .hx-msg.bot p:last-child { margin-bottom: 0; }
  .hx-msg.bot code { background: rgba(0, 255, 65, 0.1); color: var(--primary); padding: 2px 4px; border-radius: 3px; font-family: inherit; }
  .hx-msg.bot pre { background: #050805; padding: 10px; border-radius: 4px; overflow-x: auto; margin: 8px 0; border: 1px solid #1a331a; }
  .hx-msg.sys { background: rgba(255, 0, 60, 0.1); color: var(--danger); font-size: 0.8rem; align-self: center; border-radius: 4px; border: 1px solid rgba(255, 0, 60, 0.3); text-align: center; max-width: 90%; }
  .hx-load { display: none; align-self: flex-start; background: transparent; padding: 10px 16px; border-radius: 6px; border: 1px solid var(--accent); border-left: 3px solid var(--primary); gap: 4px; align-items: center; }
  .hx-dot { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; animation: hxBounce 1s infinite ease-in-out both; }
  .hx-dot:nth-child(1) { animation-delay: -0.32s; } .hx-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes hxBounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); box-shadow: 0 0 8px var(--primary); } }
  .hx-inputs { padding: 16px 20px 20px; background: #050805; border-top: 1px solid var(--accent); display: flex; gap: 10px; align-items: center; }
  .hx-field { flex: 1; background: #000; border: 1px solid var(--accent); border-radius: 4px; padding: 12px 16px; color: var(--primary); font-size: 0.9rem; outline: none; font-family: inherit; transition: all 0.2s; box-shadow: inset 0 0 5px rgba(0,0,0,0.8); }
  .hx-field::placeholder { color: var(--text-muted); }
  .hx-field:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow), inset 0 0 5px rgba(0,0,0,0.8); }
  .hx-btn { background: var(--bg-input); border: 1px solid var(--primary); border-radius: 4px; width: 44px; height: 44px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s; box-shadow: 0 0 10px rgba(0,255,65,0.1); }
  .hx-btn:hover { background: var(--primary); box-shadow: 0 0 15px var(--primary); }
  .hx-btn:hover svg { fill: #000; }
  .hx-btn:disabled { border-color: #1a331a; box-shadow: none; cursor: not-allowed; }
  .hx-btn svg { fill: var(--primary); width: 18px; height: 18px; transition: fill 0.2s; }
  .hx-stream::-webkit-scrollbar { width: 4px; } .hx-stream::-webkit-scrollbar-track { background: transparent; }
  .hx-stream::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
</style>
</head>
<body>
<div class="hx-shell">
  
  <!-- PANTALLA ANTI-BOT (NUEVO v45.6) -->
  <div id="authScreen">
    <h2>VERIFICACIÓN DE SEGURIDAD</h2>
    <p>Guardian 45.6 requiere autenticación de operador.</p>
    <div id="mathQuestion">Cargando...</div>
    <input type="number" id="mathAnswer" placeholder="?" autocomplete="off">
    <button id="verifyBtn">Validar Identidad</button>
    <div id="authError">Error de validación. Intenta de nuevo.</div>
  </div>

  <div class="hx-head">
    <div class="hx-brand">
      <div class="hx-avatar">_<div class="hx-status"></div></div>
      <div class="hx-title">
        <h3>ZERO-DAY</h3>
        <p>Root@Core:~$</p>
      </div>
    </div>
    <button class="hx-clear" onclick="ZeroDay.purge()" title="Flush Memory">
      <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
    </button>
  </div>

  <div class="hx-stream" id="hxStream">
    <div class="hx-msg bot">Conexión establecida. Soy <strong>Zero-Day</strong>, la IA de <strong>Underground Systems</strong>. Estoy lista para ejecutar. ¿Cuál es el objetivo?</div>
    <div class="hx-load" id="hxLoad"><div class="hx-dot"></div><div class="hx-dot"></div><div class="hx-dot"></div></div>
  </div>

  <div class="hx-inputs">
    <input type="text" class="hx-field" id="hxInput" placeholder="root@zero-day:~$ ..." autocomplete="off" disabled>
    <button class="hx-btn" id="hxSend" disabled>
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
    </button>
  </div>
</div>

<script>
/**
 * ZERO-DAY CORE v45.6
 * Integración con el nuevo sistema Anti-Bot (BotID).
 */
const ZeroDay = (() => {
  const _base = "https://pivot-agent-psi.vercel.app/api/agent";
  
  // NUEVO TOKEN OFICIAL
  // Token real: pivot_b4a6168db30dd80daf228626.8608aa546f5f8003
  const _t1 = "MzAwODVmZjY0NWE4ODA2OC42MjY4MjJmZGFkODBkZDMwYmQ4NjE2YTRiX3Rvdmlw";
  const _tk = atob(_t1).split("").reverse().join("");

  let _botToken = null; // Aquí guardaremos el JWT del Anti-Bot
  let _challengeId = null;

  const _uiStream = document.getElementById('hxStream');
  const _uiInput  = document.getElementById('hxInput');
  const _uiSend   = document.getElementById('hxSend');
  const _uiLoad   = document.getElementById('hxLoad');
  
  // Elementos de autenticación
  const _authScreen = document.getElementById('authScreen');
  const _mathQuestion = document.getElementById('mathQuestion');
  const _mathAnswer = document.getElementById('mathAnswer');
  const _verifyBtn = document.getElementById('verifyBtn');
  const _authError = document.getElementById('authError');

  // 1. OBTENER EL DESAFÍO MATEMÁTICO
  async function initAntiBot() {
    try {
      const res = await fetch(`${_base}?action=share-info&agentId=${encodeURIComponent(_tk)}`);
      const data = await res.json();
      
      if (data.challenge) {
        _challengeId = data.challengeId;
        _mathQuestion.innerText = data.challenge; // Ej: "¿Cuánto es 5 + 3?"
      } else {
        throw new Error("No se recibió el desafío");
      }
    } catch (err) {
      _mathQuestion.innerText = "Error de conexión.";
      console.error(err);
    }
  }

  // 2. VERIFICAR LA RESPUESTA Y OBTENER EL TOKEN
  async function verifyAnswer() {
    const answer = _mathAnswer.value.trim();
    if (!answer) return;

    _verifyBtn.innerText = "Validando...";
    _verifyBtn.disabled = true;

    try {
      const res = await fetch(`${_base}?action=verify-anti-bot`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ challengeId: _challengeId, answer: answer })
      });
      const data = await res.json();

      if (data.ok && data.botToken) {
        _botToken = data.botToken;
        _authScreen.style.display = "none"; // Ocultar pantalla
        _uiInput.disabled = false; // Habilitar chat
        _uiSend.disabled = false;
        _uiInput.focus();
      } else {
        throw new Error("Token inválido");
      }
    } catch (err) {
      _authError.style.display = "block";
      _verifyBtn.innerText = "Validar Identidad";
      _verifyBtn.disabled = false;
      _mathAnswer.value = "";
    }
  }

  // 3. ENVIAR MENSAJE (Incluyendo el botToken)
  async function _req(text) {
    try {
      const r = await fetch(`${_base}?action=share-chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 
          shareToken: _tk, 
          message: text,
          botToken: _botToken // <- INYECCIÓN DEL TOKEN ANTI-BOT
        })
      });
      const rawText = await r.text();
      try {
        return JSON.parse(rawText);
      } catch (e) {
        return { ok: false, error: "Fallo de comunicación." };
      }
    } catch (e) {
      return { ok: false, error: "Error de red." };
    }
  }

  function _render(txt, who, md = false) {
    const el = document.createElement('div');
    el.classList.add('hx-msg', who);
    if (md) {
      const clean = txt.replace(/<script[\s\S]*?<\/script>/gi, '').replace(/on\w+\s*=\s*"[^"]*"/gi, '');
      el.innerHTML = marked.parse(clean);
    } else {
      el.innerText = txt;
    }
    _uiStream.insertBefore(el, _uiLoad);
    _uiStream.scrollTop = _uiStream.scrollHeight;
  }

  function _busy(state) {
    _uiInput.disabled = state;
    _uiSend.disabled = state;
    _uiLoad.style.display = state ? 'flex' : 'none';
    if (!state) _uiInput.focus();
    else _uiStream.scrollTop = _uiStream.scrollHeight;
  }

  async function _dispatch() {
    const q = _uiInput.value.trim();
    if (!q) return;

    _uiInput.value = '';
    _render(q, 'usr');
    _busy(true);

    const response = await _req(q);

    if (response.ok) {
      _render(response.response, 'bot', true);
    } else {
      // Si el token expira o falla, pedimos re-verificación
      if (response.code === 428 || response.error?.includes("ANTI_BOT")) {
        _render('[SISTEMA]: Token de seguridad expirado. Reiniciando protocolo.', 'sys');
        setTimeout(() => location.reload(), 2000);
      } else {
        _render(`[ERROR]: ${response.error || 'Desconocido'}.`, 'sys');
      }
    }
    _busy(false);
  }

  // Event Listeners
  _verifyBtn.addEventListener('click', verifyAnswer);
  _mathAnswer.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') verifyAnswer();
  });

  _uiSend.addEventListener('click', _dispatch);
  _uiInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      _dispatch();
    }
  });

  // Iniciar flujo Anti-Bot al cargar
  initAntiBot();

  return {
    purge: () => {
      _uiStream.querySelectorAll('.hx-msg').forEach(m => m.remove());
      _render('Memoria purgada. Sistemas listos.', 'bot', true);
      _uiInput.focus();
    }
  };
})();
</script>
</body>
</html>
