<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Estrellita IA</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Inter', system-ui, sans-serif; background: #09090b; color: #f4f4f5; height: 100vh; height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
.chat-wrapper { width: 100%; max-width: 800px; height: 100%; max-height: 900px; background: #18181b; display: flex; flex-direction: column; position: relative; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
@media (min-width: 768px) { .chat-wrapper { height: 90vh; border-radius: 24px; border: 1px solid #27272a; } }
.header { padding: 16px 24px; background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid #27272a; display: flex; align-items: center; gap: 16px; z-index: 10; }
.avatar { width: 44px; height: 44px; background: linear-gradient(135deg, #f59e0b, #fbbf24); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; box-shadow: 0 0 20px rgba(245, 158, 11, 0.3); }
.header-info h1 { font-size: 16px; font-weight: 600; color: #f4f4f5; margin-bottom: 2px; }
.header-info p { font-size: 12px; color: #a1a1aa; display: flex; align-items: center; gap: 6px; }
.status-dot { width: 6px; height: 6px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.chat-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
.chat-container::-webkit-scrollbar { width: 6px; }
.chat-container::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
.message { display: flex; gap: 12px; max-width: 85%; animation: slideUp 0.3s ease-out; }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.message.user { align-self: flex-end; flex-direction: row-reverse; }
.message.agent { align-self: flex-start; }
.msg-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 16px; flex-shrink: 0; }
.message.agent .msg-avatar { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: #000; }
.message.user .msg-avatar { background: #3f3f46; color: #fff; }
.bubble { padding: 12px 18px; border-radius: 18px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
.message.agent .bubble { background: #27272a; border-bottom-left-radius: 4px; color: #f4f4f5; }
.message.user .bubble { background: #f4f4f5; color: #09090b; border-bottom-right-radius: 4px; }
.bubble p { margin-bottom: 8px; } .bubble p:last-child { margin-bottom: 0; }
.bubble code { background: rgba(0, 0, 0, 0.2); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; }
.bubble pre { background: #09090b; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
.bubble pre code { background: none; padding: 0; }
.typing { display: flex; gap: 4px; padding: 16px 20px; background: #27272a; border-radius: 18px; border-bottom-left-radius: 4px; width: fit-content; }
.typing span { width: 6px; height: 6px; background: #a1a1aa; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
.typing span:nth-child(1) { animation-delay: -0.32s; } .typing span:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
.input-area { padding: 16px 24px 24px; background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(12px); border-top: 1px solid #27272a; }
.input-wrapper { display: flex; gap: 12px; background: #27272a; padding: 8px; border-radius: 28px; border: 1px solid #3f3f46; transition: border-color 0.2s; }
.input-wrapper:focus-within { border-color: #f59e0b; }
.chat-input { flex: 1; background: transparent; border: none; padding: 10px 16px; color: #f4f4f5; font-size: 15px; font-family: inherit; outline: none; }
.chat-input::placeholder { color: #71717a; }
.send-btn { background: #f59e0b; color: #09090b; border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s; }
.send-btn:hover:not(:disabled) { background: #fbbf24; transform: scale(1.05); }
.send-btn:disabled { background: #3f3f46; color: #71717a; cursor: not-allowed; }
.send-btn svg { width: 20px; height: 20px; }
.error-msg { background: #7f1d1d; color: #fca5a5; padding: 12px; border-radius: 8px; font-size: 13px; text-align: center; margin: 0 24px 16px; border: 1px solid #991b1b; }
</style>
</head>
<body>

<div class="chat-wrapper">
    <div class="header">
        <div class="avatar">⭐</div>
        <div class="header-info">
            <h1>Estrellita</h1>
            <p><span class="status-dot"></span> En línea</p>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message agent">
            <div class="msg-avatar">⭐</div>
            <div class="bubble">¡Hola! Soy Estrellita. ✨ ¿En qué te puedo ayudar hoy?</div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="chatInput" class="chat-input" placeholder="Escribe tu mensaje..." autocomplete="off">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>
</div>

<script>
// =====================================================================
// CONFIGURACIÓN DE ESTRELLITA
// =====================================================================
const API_KEY = 'pk_d9eaba9535316610a261926f774ae7caa3912af56a645331c1225e69eb76537b';
const AGENT_ID = 'pivot_67476746e00c42b548be9f3e';
const API_URL = 'https://pivot-agent-psi.vercel.app/api/agent?action=chat';

let isSending = false;
const chatContainer = document.getElementById('chatContainer');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');

marked.setOptions({ breaks: true, gfm: true });

function addMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}`;
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = sender === 'agent' ? '⭐' : '👤';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (sender === 'agent') {
        bubble.innerHTML = DOMPurify.sanitize(marked.parse(text));
    } else {
        bubble.textContent = text;
    }
    msgDiv.appendChild(avatar);
    msgDiv.appendChild(bubble);
    chatContainer.appendChild(msgDiv);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

function showTyping() {
    const typingDiv = document.createElement('div');
    typingDiv.className = 'message agent';
    typingDiv.id = 'typingIndicator';
    typingDiv.innerHTML = `
        <div class="msg-avatar">⭐</div>
        <div class="typing"><span></span><span></span><span></span></div>
    `;
    chatContainer.appendChild(typingDiv);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

function hideTyping() {
    const typing = document.getElementById('typingIndicator');
    if (typing) typing.remove();
}

function showError(msg) {
    const errDiv = document.createElement('div');
    errDiv.className = 'error-msg';
    errDiv.textContent = msg;
    chatContainer.appendChild(errDiv);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    setTimeout(() => errDiv.remove(), 5000);
}

async function sendMessage() {
    if (isSending) return;
    const text = chatInput.value.trim();
    if (!text) return;

    isSending = true;
    sendBtn.disabled = true;
    chatInput.value = '';

    addMessage(text, 'user');
    showTyping();

    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                agentId: AGENT_ID,
                message: text,
                history: [],
                attachments: [],
                training: null
            })
        });

        const data = await response.json();
        hideTyping();

        if (data.ok && data.response) {
            addMessage(data.response, 'agent');
        } else {
            showError(data.error || 'No se pudo obtener respuesta de Estrellita.');
        }
    } catch (error) {
        hideTyping();
        showError('Error de conexión. Intenta de nuevo.');
    } finally {
        isSending = false;
        sendBtn.disabled = false;
        chatInput.focus();
    }
}

chatInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

chatInput.focus();
</script>
</body>
</html>
