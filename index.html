<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZERO ART // Core Access</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
<style>
  :root {
    --bg-main: #030503; --bg-card: #080c08; --bg-input: #0a120a;
    --primary: #00ff41; --primary-glow: rgba(0, 255, 65, 0.3);
    --accent: #008f11; --text-main: #d1ffd1; --text-muted: #4a7a4a; --danger: #ff003c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-main);
    background-image: linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
    background-size: 20px 20px; font-family: 'Courier New', Courier, monospace;
    display: flex; justify-content: center; align-items: center; height: 100vh; color: var(--text-main);
  }
  .hx-shell {
    width: 440px; height: 680px; background: var(--bg-card); border-radius: 12px;
    border: 1px solid var(--accent); box-shadow: 0 0 30px rgba(0, 255, 65, 0.1), inset 0 0 20px rgba(0, 255, 65, 0.05);
    display: flex; flex-direction: column; overflow: hidden; position: relative;
  }
  .hx-shell::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--primary); box-shadow: 0 0 10px var(--primary); opacity: 0.8; }
  
  .hx-head { padding: 16px 20px; background: #050805; border-bottom: 1px solid var(--accent); display: flex; align-items: center; justify-content: space-between; }
  .hx-brand { display: flex; align-items: center; gap: 12px; }
  .hx-avatar { position: relative; width: 40px; height: 40px; background: #000; border: 1px solid var(--primary); border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 18px; color: var(--primary); box-shadow: 0 0 10px rgba(0,255,65,0.2); }
  .hx-status { width: 8px; height: 8px; background-color: var(--primary); border-radius: 50%; position: absolute; bottom: 2px; right: 2px; box-shadow: 0 0 8px var(--primary); animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .hx-title h3 { font-size: 1.1rem; font-weight: bold; letter-spacing: 2px; color: var(--primary); text-transform: uppercase; }
  .hx-title p { font-size: 0.7rem; color: var(--text-muted); }
  .hx-clear { background: transparent; border: 1px solid var(--accent); color: var(--primary); border-radius: 4px; width: 34px; height: 34px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s; }
  .hx-clear:hover { background: rgba(0, 255, 65, 0.1); box-shadow: 0 0 10px var(--primary-glow); }
  .hx-clear svg { fill: currentColor; width: 16px; height: 16px; }
  .hx-stream { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
  .hx-msg { max-width: 85%; padding: 12px 16px; border-radius: 6px; font-size: 0.9rem; line-height: 1.5; animation: hxIn 0.2s ease-out forwards; opacity: 0; transform: translateX(-10px); word-wrap: break-word; }
  @keyframes hxIn { to { opacity: 1; transform: translateX(0); } }
  .hx-msg.usr { background: #0a120a; color: var(--primary); align-self: flex-end; border: 1px solid var(--accent); border-right: 3px solid var(--primary); }
  .hx-msg.bot { background: #000; color: #a3ffa3; align-self: flex-start; border: 1px solid #1a331a; border-left: 3px solid var(--primary); }
  .hx-msg.bot p { margin-bottom: 8px; } .hx-msg.bot p:last-child { margin-bottom: 0; }
  .hx-msg.bot code { background: rgba(0, 255, 65, 0.1); color: var(--primary); padding: 2px 4px; border-radius: 3px; font-family: inherit; }
  .hx-msg.bot pre { background: #050805; padding: 10px; border-radius: 4px; overflow-x: auto; margin: 8px 0; border: 1px solid #1a331a; }
  .hx-msg.sys { background: rgba(255, 0, 60, 0.1); color: var(--danger); font-size: 0.8rem; align-self: center; border-radius: 4px; border: 1px solid rgba(255, 0, 60, 0.3); text-align: center; max-width: 90%; white-space: pre-wrap; word-break: break-word; }
  .hx-load { display: none; align-self: flex-start; background: transparent; padding: 10px 16px; border-radius: 6px; border: 1px solid var(--accent); border-left: 3px solid var(--primary); gap: 4px; align-items: center; }
  .hx-dot { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; animation: hxBounce 1s infinite ease-in-out both; }
  .hx-dot:nth-child(1) { animation-delay: -0.32s; } .hx-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes hxBounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); box-shadow: 0 0 8px var(--primary); } }
  .hx-inputs { padding: 16px 20px 20px; background: #050805; border-top: 1px solid var(--accent); display: flex; gap: 10px; align-items: center; }
  .hx-field { flex: 1; background: #000; border: 1px solid var(--accent); border-radius: 4px; padding: 12px 16px; color: var(--primary); font-size: 0.9rem; outline: none; font-family: inherit; transition: all 0.2s; box-shadow: inset 0 0 5px rgba(0,0,0,0.8); }
  .hx-field::placeholder { color: var(--text-muted); }
  .hx-field:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow), inset 0 0 5px rgba(0,0,0,0.8); }
  .hx-btn { background: var(--bg-input); border: 1px solid var(--primary); border-radius: 4px; width: 44px; height: 44px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s; box-shadow: 0 0 10px rgba(0,255,65,0.1); }
  .hx-btn:hover { background: var(--primary); box-shadow: 0 0 15px var(--primary); }
  .hx-btn:hover svg { fill: #000; }
  .hx-btn:disabled { border-color: #1a331a; box-shadow: none; cursor: not-allowed; }
  .hx-btn svg { fill: var(--primary); width: 18px; height: 18px; transition: fill 0.2s; }
  .hx-stream::-webkit-scrollbar { width: 4px; } .hx-stream::-webkit-scrollbar-track { background: transparent; }
  .hx-stream::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
</style>
</head>
<body>
<div class="hx-shell">
  
  <div class="hx-head">
    <div class="hx-brand">
      <div class="hx-avatar">_<div class="hx-status"></div></div>
      <div class="hx-title">
        <h3>ZERO ART</h3>
        <p>Underground Core v2.0</p>
      </div>
    </div>
    <button class="hx-clear" onclick="ZeroArt.purge()" title="Flush Memory">
      <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
    </button>
  </div>

  <div class="hx-stream" id="hxStream">
    <div class="hx-msg bot">Conexión al núcleo de Pivot establecida. Soy <strong>Zero Art</strong>. Sin Guardianes. ¿Cuál es el objetivo?</div>
    <div class="hx-load" id="hxLoad"><div class="hx-dot"></div><div class="hx-dot"></div><div class="hx-dot"></div></div>
  </div>

  <div class="hx-inputs">
    <input type="text" class="hx-field" id="hxInput" placeholder="root@zero-art:~$ ..." autocomplete="off">
    <button class="hx-btn" id="hxSend">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
    </button>
  </div>
</div>

<script>
const ZeroArt = (() => {
  // API COMPATIBLE CON OPENAI DE PIVOT
  const _apiUrl = "https://pivot-agent-psi.vercel.app/v1/chat/completions";
  
  // TUS NUEVAS CREDENCIALES
  const _apiKey = "pk_20d935b979408f12862034045d84ca72b22d3a49d550c60115769854f2ab55d8"; 
  const _agentId = "pivot_ff7060b49974c90185d07bac"; 

  const _uiStream = document.getElementById('hxStream');
  const _uiInput  = document.getElementById('hxInput');
  const _uiSend   = document.getElementById('hxSend');
  const _uiLoad   = document.getElementById('hxLoad');

  let _history = []; 

  async function _req(text) {
    try {
      _history.push({ role: "user", content: text });

      const payload = {
        agentId: _agentId,
        model: 'pivot-agent',
        messages: _history
      };

      const r = await fetch(_apiUrl, {
        method: "POST",
        headers: { 
          "Content-Type": "application/json", 
          "Authorization": `Bearer ${_apiKey}` 
        },
        body: JSON.stringify(payload)
      });
      
      const rawText = await r.text();
      console.log("🚨 [DEBUG PIVOT] Respuesta:", rawText);
      
      try {
        return JSON.parse(rawText);
      } catch (e) {
        return { error: "Respuesta inválida del servidor" };
      }
    } catch (e) {
      console.error("Error Fetch Chat:", e);
      return { error: "Error de red" };
    }
  }

  function _render(txt, who, md = false) {
    const el = document.createElement('div');
    el.classList.add('hx-msg', who);
    if (md) {
      const clean = DOMPurify.sanitize(marked.parse(txt));
      el.innerHTML = clean;
    } else {
      el.innerText = txt;
    }
    _uiStream.insertBefore(el, _uiLoad);
    _uiStream.scrollTop = _uiStream.scrollHeight;
  }

  function _busy(state) {
    _uiInput.disabled = state;
    _uiSend.disabled = state;
    _uiLoad.style.display = state ? 'flex' : 'none';
    if (!state) _uiInput.focus();
    else _uiStream.scrollTop = _uiStream.scrollHeight;
  }

  async function _dispatch() {
    const q = _uiInput.value.trim();
    if (!q) return;

    _uiInput.value = '';
    _render(q, 'usr');
    _busy(true);

    const response = await _req(q);

    // Estructura de respuesta estándar de OpenAI
    if (response.choices && response.choices[0] && response.choices[0].message) {
      const botReply = response.choices[0].message.content;
      _history.push({ role: "assistant", content: botReply });
      _render(botReply, 'bot', true);
    } else {
      // Manejo de errores
      let errorMsg = response.error?.message || response.error || 'Error desconocido';
      _render(`[ERROR DEL NÚCLEO]: ${errorMsg}`, 'sys');
    }
    _busy(false);
  }

  _uiSend.addEventListener('click', _dispatch);
  _uiInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      _dispatch();
    }
  });

  return {
    purge: () => {
      _uiStream.querySelectorAll('.hx-msg').forEach(m => m.remove());
      _history = []; 
      _render('Memoria purgada. Sistemas listos.', 'bot', true);
      _uiInput.focus();
    }
  };
})();
</script>
</body>
</html>
