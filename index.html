<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veltrix AI - Premium Interface</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg-main: #06060c;
    --bg-card: #0d0d1a;
    --bg-input: #121224;
    --primary: #8b5cf6;
    --primary-glow: rgba(139, 92, 246, 0.4);
    --accent: #c084fc;
    --text-main: #f1f5f9;
    --text-muted: #64748b;
    --success: #10b981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-main);
    background-image:
      radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.1) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(192, 132, 252, 0.05) 0px, transparent 50%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: var(--text-main);
  }
  .chat-wrapper {
    width: 440px;
    height: 680px;
    background: var(--bg-card);
    border-radius: 28px;
    border: 1px solid rgba(139, 92, 246, 0.25);
    box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px -10px var(--primary-glow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    backdrop-filter: blur(10px);
  }
  .chat-header {
    padding: 20px 24px;
    background: linear-gradient(135deg, rgba(20, 20, 35, 0.8), rgba(13, 13, 26, 0.8));
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .agent-info { display: flex; align-items: center; gap: 14px; }
  .avatar-container {
    position: relative;
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    box-shadow: 0 0 15px var(--primary-glow);
  }
  .status-badge {
    width: 11px;
    height: 11px;
    background-color: var(--success);
    border: 2px solid var(--bg-card);
    border-radius: 50%;
    position: absolute;
    bottom: 0;
    right: 0;
    box-shadow: 0 0 8px var(--success);
  }
  .agent-title h3 { font-size: 1.05rem; font-weight: 600; letter-spacing: 0.3px; }
  .agent-title p { font-size: 0.78rem; color: var(--text-muted); }
  .clear-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(139, 92, 246, 0.25);
    color: var(--text-muted);
    border-radius: 12px;
    width: 38px;
    height: 38px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .clear-btn:hover {
    color: var(--text-main);
    border-color: var(--primary);
    box-shadow: 0 0 12px var(--primary-glow);
  }
  .clear-btn svg { fill: currentColor; width: 18px; height: 18px; }
  .chat-messages {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }
  .message {
    max-width: 80%;
    padding: 14px 18px;
    border-radius: 20px;
    font-size: 0.95rem;
    line-height: 1.5;
    animation: fadeIn 0.3s ease-out forwards;
    opacity: 0;
    transform: translateY(10px);
    word-wrap: break-word;
  }
  @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
  .message.user {
    background: linear-gradient(135deg, #7c3aed, #6d28d9);
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
  }
  .message.agent {
    background: rgba(255, 255, 255, 0.04);
    color: #e2e8f0;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
  .message.agent p { margin-bottom: 8px; }
  .message.agent p:last-child { margin-bottom: 0; }
  .message.agent code {
    background: rgba(255, 255, 255, 0.1);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 0.85rem;
  }
  .message.agent pre {
    background: #05050a;
    padding: 10px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 8px 0;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
  .message.agent ul, .message.agent ol { padding-left: 20px; margin: 6px 0; }
  .message.system {
    background: rgba(239, 68, 68, 0.08);
    color: #f87171;
    font-size: 0.85rem;
    align-self: center;
    border-radius: 10px;
    border: 1px solid rgba(239, 68, 68, 0.15);
    text-align: center;
    max-width: 90%;
  }
  .typing-indicator {
    display: none;
    align-self: flex-start;
    background: rgba(255, 255, 255, 0.04);
    padding: 14px 22px;
    border-radius: 20px;
    border-bottom-left-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    gap: 5px;
    align-items: center;
  }
  .typing-dot {
    width: 7px;
    height: 7px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .typing-dot:nth-child(1) { animation-delay: -0.32s; }
  .typing-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1.0); }
  }
  .chat-input-container {
    padding: 20px 24px 24px;
    background: rgba(9, 9, 18, 0.6);
    border-top: 1px solid rgba(255, 255, 255, 0.04);
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .chat-input {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid rgba(139, 92, 246, 0.15);
    border-radius: 16px;
    padding: 14px 18px;
    color: var(--text-main);
    font-size: 0.95rem;
    outline: none;
    transition: all 0.25s ease;
  }
  .chat-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 15px rgba(139, 92, 246, 0.15);
  }
  .send-button {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border: none;
    border-radius: 16px;
    width: 48px;
    height: 48px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(139, 92, 246, 0.2);
    transition: all 0.2s ease;
  }
  .send-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(139, 92, 246, 0.3);
  }
  .send-button:disabled {
    background: #27273a;
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
  }
  .send-button svg { fill: white; width: 18px; height: 18px; }
  .chat-messages::-webkit-scrollbar { width: 5px; }
  .chat-messages::-webkit-scrollbar-track { background: transparent; }
  .chat-messages::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
  }
</style>
</head>
<body>
<div class="chat-wrapper">
  <div class="chat-header">
    <div class="agent-info">
      <div class="avatar-container">
        🟣
        <div class="status-badge"></div>
      </div>
      <div class="agent-title">
        <h3>Veltrix AI</h3>
        <p>En línea · Veltrix Innovations</p>
      </div>
    </div>
    <button class="clear-btn" id="clearBtn" onclick="limpiarChat()" title="Limpiar conversación">
      <svg viewBox="0 0 24 24">
        <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
      </svg>
    </button>
  </div>

  <div class="chat-messages" id="chatContainer">
    <div class="message agent">¡Hola! Soy <strong>Veltrix AI</strong>. ¿En qué puedo ayudarte hoy?</div>
    <div class="typing-indicator" id="typingIndicator">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  </div>

  <div class="chat-input-container">
    <input type="text" class="chat-input" id="messageInput" placeholder="Escribe un mensaje..." autocomplete="off">
    <button class="send-button" id="sendBtn" onclick="enviarMensajePivot()">
      <svg viewBox="0 0 24 24">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
      </svg>
    </button>
  </div>
</div>

<script>
  const SHARE_TOKEN = "pivot_c43fe7cfdee50e655f04ea96.5bba8804baee3ff8";
  const API_ENDPOINT = "https://pivot-agent-psi.vercel.app/api/agent?action=share-chat";

  const chatContainer   = document.getElementById('chatContainer');
  const messageInput    = document.getElementById('messageInput');
  const sendBtn         = document.getElementById('sendBtn');
  const typingIndicator = document.getElementById('typingIndicator');

  messageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      enviarMensajePivot();
    }
  });

  async function enviarMensajePivot() {
    const query = messageInput.value.trim();
    if (!query) return;

    messageInput.value = '';
    renderizarGlobo(query, 'user');
    setControlState(true);

    try {
      // Enviamos el mensaje LIMPIO, sin prompts ocultos ni inyecciones
      const response = await fetch(API_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          shareToken: SHARE_TOKEN,
          message: query 
        })
      });

      const data = await response.json();

      if (data.ok) {
        renderizarGlobo(data.response, 'agent', true);
      } else {
        if (data.code === 402) {
          renderizarGlobo("El servicio no tiene créditos disponibles en este momento. Contacta al administrador.", 'system');
        } else if (data.code === 429) {
          renderizarGlobo("Demasiados mensajes seguidos. Espera unos segundos e intenta de nuevo.", 'system');
        } else {
          renderizarGlobo(
            `Error de la plataforma: ${data.error || 'Desconocido'} (Código: ${data.code || 'N/A'})`,
            'system'
          );
        }
      }
    } catch (err) {
      renderizarGlobo("No se pudo establecer conexión con los servidores. Verifica tu conexión a internet.", 'system');
    } finally {
      setControlState(false);
    }
  }

  function renderizarGlobo(texto, remitente, contieneMarkdown = false) {
    const elementoMensaje = document.createElement('div');
    elementoMensaje.classList.add('message', remitente);

    if (contieneMarkdown) {
      const limpio = texto
        .replace(/<script[\s\S]*?<\/script>/gi, '')
        .replace(/on\w+\s*=\s*"[^"]*"/gi, '');
      elementoMensaje.innerHTML = marked.parse(limpio);
    } else {
      elementoMensaje.innerText = texto;
    }

    chatContainer.insertBefore(elementoMensaje, typingIndicator);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function setControlState(isPending) {
    messageInput.disabled = isPending;
    sendBtn.disabled = isPending;
    typingIndicator.style.display = isPending ? 'flex' : 'none';

    if (!isPending) {
      messageInput.focus();
    } else {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  }

  function limpiarChat() {
    const mensajes = chatContainer.querySelectorAll('.message');
    mensajes.forEach(m => m.remove());

    const bienvenida = document.createElement('div');
    bienvenida.className = 'message agent';
    bienvenida.innerHTML = 'Conversación reiniciada. Soy <strong>Veltrix AI</strong>. ¿En qué puedo ayudarte ahora? ✨';
    chatContainer.insertBefore(bienvenida, typingIndicator);

    messageInput.focus();
  }
</script>
</body>
</html>
